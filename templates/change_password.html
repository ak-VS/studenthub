{% extends "base.html" %}
{% block title %}Change password | StudentHub{% endblock %}
{% block content %}
<section class="students login-box">
    <h2>Change password</h2>
    <form method="POST" class="stack">
        <div class="form-group">
            <label for="current">Current password</label>
            <input type="password" id="current" name="current" required>
        </div>
        <div class="form-group">
            <label for="new">New password (6+ characters)</label>
            <input type="password" id="new" name="new" minlength="6" required>
        </div>
        <div class="form-group">
            <label for="confirm">Confirm new password</label>
            <input type="password" id="confirm" name="confirm" minlength="6" required>
        </div>
        <button type="submit" class="view-btn">Update password</button>
    </form>
</section>
{% endblock %}

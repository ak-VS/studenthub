{% extends "base.html" %}
{% block title %}Analytics | StudentHub{% endblock %}
{% block content %}
<section class="students">
    <h2>Analytics</h2>
    <p class="muted">Live figures from the database.</p>
</section>

<section class="charts">
    <div class="students">
        <h2>Students per course</h2>
        <canvas id="courseChart"></canvas>
    </div>
    <div class="students">
        <h2>Average marks by subject (%)</h2>
        <div class="chart-box" style="height: {{ [200, data.marks.labels|length * 46 + 70]|max }}px">
            <canvas id="marksChart"></canvas>
        </div>
    </div>
    <div class="students">
        <h2>Attendance by subject (%)</h2>
        <div class="chart-box" style="height: {{ [200, data.attendance.labels|length * 46 + 70]|max }}px">
            <canvas id="attChart"></canvas>
        </div>
    </div>
</section>
{% endblock %}

{% block scripts %}
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<script>
    const data = {{ data|tojson }};
    const low = {{ low }};
    applyChartTheme();

    const barChart = (id, block, colors, horizontal, valueAxis) => registerChart(new Chart(document.getElementById(id), {
        type: "bar",
        data: {
            labels: block.labels,
            datasets: [{ data: block.values, backgroundColor: colors, borderRadius: 8, maxBarThickness: 30 }]
        },
        options: {
            indexAxis: horizontal ? "y" : "x",
            maintainAspectRatio: !horizontal,
            plugins: { legend: { display: false } },
            scales: horizontal
                ? { x: valueAxis, y: { grid: { display: false } } }
                : { y: valueAxis, x: { grid: { display: false } } }
        }
    }));

    barChart("courseChart", data.courses, "#a855f7", false, { beginAtZero: true, ticks: { precision: 0 } });
    barChart("marksChart", data.marks, "#6d4aff", true, { min: 0, max: 100 });
    barChart("attChart", data.attendance,
        data.attendance.values.map(v => v !== null && v < low ? "#f43f5e" : "#10b981"),
        true, { min: 0, max: 100 });
</script>
{% endblock %}

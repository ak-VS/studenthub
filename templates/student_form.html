{% extends "base.html" %}
{% block title %}{{ form_title }} | StudentHub{% endblock %}
{% block content %}
<section class="students">
    <h2>{{ form_title }}</h2>

    <form method="POST" class="stack">
        <div class="form-grid">

            <div class="form-group">
                <label>Full Name</label>
                <input type="text" name="name" value="{{ student.name if student else '' }}" required>
            </div>

            <div class="form-group">
                <label>Email (also the login)</label>
                <input type="email" name="email" value="{{ student.email if student else '' }}" required>
            </div>

            <div class="form-group">
                <label>Phone</label>
                <input type="text" name="phone" value="{{ student.phone or '' if student else '' }}">
            </div>

            <div class="form-group">
                <label>Address</label>
                <input type="text" name="address" value="{{ student.address or '' if student else '' }}">
            </div>

            <div class="form-group">
                <label>Gender</label>
                <select name="gender">
                    <option value="">Select Gender</option>
                    {% for g in ['Male', 'Female', 'Other'] %}
                    <option value="{{ g }}" {% if student and student.gender == g %}selected{% endif %}>{{ g }}</option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Course</label>
                <select name="course_id" required>
                    <option value="">Select Course</option>
                    {% for course in courses %}
                    <option value="{{ course.id }}"
                        {% if student and student.course_id|string == course.id|string %}selected{% endif %}>
                        {{ course.name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Date of Birth {% if not student or not student.id %}(sets the first password){% endif %}</label>
                <input type="date" name="date_of_birth"
                       value="{{ student.date_of_birth or '' if student else '' }}"
                       {% if not student or not student.id %}required{% endif %}>
            </div>

            <div class="form-group">
                <label>Status</label>
                <select name="status">
                    <option value="Active" {% if not student or student.status != 'Inactive' %}selected{% endif %}>Active</option>
                    <option value="Inactive" {% if student and student.status == 'Inactive' %}selected{% endif %}>Inactive</option>
                </select>
            </div>

        </div>

        <div class="action-buttons">
            <button type="submit" class="view-btn">Save student</button>
            <a href="{{ url_for('students') }}" class="view-btn muted-btn">Cancel</a>
        </div>
    </form>
</section>
{% endblock %}
